name: Build CFBS Attendance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'index.html'
      - 'icon.png'
      - 'android/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Required Files
        run: |
          echo "Checking index.html..."
          if [ ! -f index.html ]; then
            echo "::error::index.html not found in repository root"
            exit 1
          fi
          echo "index.html found"

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Create Android Project with Original Design Support
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/cfbs/attendance
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp index.html android/app/src/main/assets/index.html

          if [ -f icon.png ]; then
            cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CFBS Attendance"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.cfbs.attendance'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.cfbs.attendance'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="CFBS Attendance"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|keyboardHidden|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/cfbs/attendance/MainActivity.java <<'EOF'
          package com.cfbs.attendance;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleExternalUrl(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleExternalUrl(Uri.parse(url));
                      }

                      private boolean handleExternalUrl(Uri uri) {
                          String scheme = uri.getScheme();
                          if (scheme == null) return false;
                          if (scheme.equalsIgnoreCase("sms") ||
                              scheme.equalsIgnoreCase("smsto") ||
                              scheme.equalsIgnoreCase("mms") ||
                              scheme.equalsIgnoreCase("mmsto")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_SENDTO, uri);
                                  startActivity(intent);
                              } catch (ActivityNotFoundException e) {
                                  Toast.makeText(MainActivity.this,
                                      "SMS ပို့ရန် Messaging အက်ပ် မတွေ့ပါ။",
                                      Toast.LENGTH_LONG).show();
                              }
                              return true;
                          }
                          return false;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());

                  setContentView(webView);
                  if (savedInstanceState == null) {
                      webView.loadUrl("file:///android_asset/index.html");
                  } else {
                      webView.restoreState(savedInstanceState);
                      if (webView.getUrl() == null) {
                          webView.loadUrl("file:///android_asset/index.html");
                      }
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">CFBS Attendance</string>
          </resources>
          EOF

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK file was not generated"
            exit 1
          fi
          ls -lh "$APK"
          echo "APK build successful with SMS handling and WebView state support"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Student-Attendance-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
