name: Build CFBS Attendance APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/cfbs/attendance
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "CFBSStudentAttendance"
          include(":app")' > settings.gradle

          echo "plugins { id 'com.android.application' version '8.5.2' apply false }" > build.gradle

          echo "plugins { id 'com.android.application' }
          android {
            namespace 'com.cfbs.attendance'
            compileSdk 35
            defaultConfig {
              applicationId 'com.cfbs.attendance'
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName '1.0'
            }
          }" > app/build.gradle

          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="CFBS Student Attendance" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>' > app/src/main/AndroidManifest.xml

          cat > app/src/main/java/com/cfbs/attendance/MainActivity.java <<'EOF'
          package com.cfbs.attendance;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
            public void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              setContentView(w);
              w.loadUrl("file:///android_asset/index.html");
            }
          }
          EOF

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Student-Attendance-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
