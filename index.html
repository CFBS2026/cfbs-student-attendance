<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1e3a8a">
<title>CHINDWIN FUTURE BRIGHT - Student Attendance</title>
<style>
:root{--primary:#1e3a8a;--primary-light:#2563eb;--bg:#f1f5f9;--card-bg:#ffffff;--ink:#0f172a;--line:#cbd5e1;--radius:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Myanmar",sans-serif;padding-bottom:20px}

/* App Header */
header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:16px;box-shadow:0 4px 12px rgba(30,58,138,0.2)}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.header-brand{display:flex;align-items:center;gap:12px}
.header-brand img{width:45px;height:45px;border-radius:12px;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
.header-text h1{font-size:16px;margin:0;font-weight:700;line-height:1.2}
.header-text p{margin:2px 0 0;font-size:11px;opacity:0.9}
.lang-btn{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer}

main{max-width:600px;margin:0 auto;padding:12px}

/* Navigation Tabs */
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;background:#e2e8f0;padding:4px;border-radius:14px}
nav button{border:0;border-radius:10px;padding:10px 2px;font-size:11px;font-weight:600;background:transparent;color:#475569;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all 0.2s ease}
nav button.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(30,58,138,0.25)}

/* Cards & Layout */
.card{background:var(--card-bg);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.04);border:1px solid #e2e8f0}
.card h2{color:var(--primary);font-size:16px;margin:0 0 12px;font-weight:700}

/* Stat Grid */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{text-align:center;padding:12px 6px;font-size:11px;color:#fff;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
.stat b{display:block;color:#fff;font-size:20px;margin-top:2px;font-weight:700}
.stats .stat:nth-child(1){background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.stats .stat:nth-child(2){background:linear-gradient(135deg,#10b981,#047857)}
.stats .stat:nth-child(3){background:linear-gradient(135deg,#ec4899,#be185d)}

.row{display:flex;gap:8px;flex-wrap:wrap}
.field{flex:1;min-width:140px;margin-bottom:10px}
.field label{display:block;font-weight:600;font-size:12px;margin-bottom:4px;color:#475569}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink);font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-light)}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-size:13px;font-weight:600;background:#e2e8f0;color:var(--primary);cursor:pointer;flex:1;text-align:center}
button.btn-primary{background:var(--primary);color:#fff}

/* Mobile List Cards */
.item-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-info{flex:1}
.item-name{font-weight:700;font-size:14px;color:var(--ink);margin-bottom:2px}
.item-sub{font-size:12px;color:#64748b}
.item-status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-block;margin-top:4px}
.status-active{background:#dcfce7;color:#15803d}
.status-inactive{background:#fee2e2;color:#b91c1c}

.hidden{display:none!important}
.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 12px;border-radius:10px;font-size:12px;margin:10px 0}
textarea{min-height:140px;resize:vertical}
.message{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:30px;z-index:100;font-weight:500;font-size:13px}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-brand">
      <img src="1000003292.jpg" alt="Logo">
      <div class="header-text">
        <h1 data-i18n="school_name">CHINDWIN FUTURE BRIGHT</h1>
        <p data-i18n="school_sub">Student Attendance Dashboard</p>
      </div>
    </div>
    <button class="lang-btn" id="langToggle">🇲🇲 မြန်မာ</button>
  </div>
</header>

<main>
  <nav class="no-print">
    <button class="active" data-tab="students"><span>📋</span><span data-i18n="tab_students">စာရင်း</span></button>
    <button data-tab="attendance"><span>📅</span><span data-i18n="tab_attendance">တက်ရောက်</span></button>
    <button data-tab="monthly"><span>📊</span><span data-i18n="tab_monthly">လစဉ်</span></button>
    <button data-tab="principal"><span>✉️</span><span data-i18n="tab_principal">ကျောင်းအုပ်</span></button>
  </nav>

  <!-- Students Tab -->
  <section id="students" class="tab">
    <div class="stats">
      <div class="stat"><span data-i18n="stat_total">စုစုပေါင်း</span><b id="totalStudents">0</b></div>
      <div class="stat"><span data-i18n="stat_boys">ကျား</span><b id="totalBoys">0</b></div>
      <div class="stat"><span data-i18n="stat_girls">မ</span><b id="totalGirls">0</b></div>
    </div>
    
    <div class="card">
      <div class="row">
        <div class="field"><label data-i18n="lbl_class">အတန်း</label><select id="studentClass"></select></div>
        <div class="field"><label data-i18n="lbl_search">ရှာရန်</label><input id="studentSearch" placeholder="အမည် / အမှတ်"></div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="showStudentForm" data-i18n="btn_add_student">＋ ကျောင်းသားအသစ်</button>
        <button class="btn" id="backupButton" data-i18n="btn_backup">Backup သိမ်း</button>
        <button class="btn" id="chooseRestore" data-i18n="btn_restore">Backup ထည့်</button>
        <input class="hidden" type="file" id="restoreFile" accept=".json,application/json">
      </div>
    </div>

    <div id="studentFormBox" class="card hidden">
      <h2 data-i18n="form_title">ကျောင်းသားအချက်အလက်</h2>
      <form id="studentForm">
        <input type="hidden" id="editStudentId">
        <div class="field"><label data-i18n="lbl_sid">ကျောင်းဝင်အမှတ် *</label><input id="sid" required></div>
        <div class="field"><label data-i18n="lbl_name">ကျောင်းသားအမည် *</label><input id="sname" required></div>
        <div class="field"><label data-i18n="lbl_dob">မွေးသက္ကရာဇ် *</label><input id="sdob" type="date" required></div>
        <div class="field"><label data-i18n="lbl_parent">မိဘအမည် *</label><input id="sparent" required></div>
        <div class="row">
          <div class="field"><label data-i18n="lbl_gender">ကျား / မ *</label><select id="sgender"><option value="ကျား" data-i18n="opt_boy">ကျား</option><option value="မ" data-i18n="opt_girl">မ</option></select></div>
          <div class="field"><label data-i18n="lbl_phone">ဖုန်းနံပါတ်</label><input id="sphone" inputmode="tel" placeholder="09xxxxxxxxx"></div>
        </div>
        <div class="field"><label data-i18n="lbl_address">လိပ်စာ</label><input id="saddress"></div>
        <div class="field"><label data-i18n="lbl_status">အခြေအနေ</label><select id="sactive"><option value="yes" data-i18n="opt_active">လက်ရှိတက်ရောက်</option><option value="no" data-i18n="opt_inactive">ကျောင်းမှထွက်</option></select></div>
        <div class="actions" style="margin-top:12px">
          <button class="btn btn-primary" type="submit" data-i18n="btn_save">သိမ်းမည်</button>
          <button class="btn" type="button" id="cancelStudentForm" data-i18n="btn_cancel">မလုပ်တော့ပါ</button>
        </div>
      </form>
    </div>

    <div id="studentCardsList"></div>
  </section>

  <!-- Attendance Tab -->
  <section id="attendance" class="tab hidden">
    <div class="card">
      <div class="row">
        <div class="field"><label data-i18n="lbl_class">အတန်း</label><select id="attClass"></select></div>
        <div class="field"><label data-i18n="lbl_date">ရက်စွဲ</label><input id="attDate" type="date"></div>
      </div>
      <div class="stats" style="grid-template-columns:repeat(2,1fr)">
        <div class="stat"><span data-i18n="stat_present">တက်</span><b id="attPresent">0</b></div>
        <div class="stat" style="background:linear-gradient(135deg,#ef4444,#b91c1c)"><span data-i18n="stat_absent">ပျက်</span><b id="attAbsent">0</b></div>
      </div>
      <div class="actions">
        <button class="btn" id="markAllPresent" style="background:#10b981;color:#fff" data-i18n="btn_all_present">အားလုံးတက်</button>
        <button class="btn" id="markAllAbsent" style="background:#ef4444;color:#fff" data-i18n="btn_all_absent">အားလုံးပျက်</button>
      </div>
    </div>
    <div id="attendanceCardsList"></div>
    <div class="actions">
      <button class="btn btn-primary" id="saveAttendance" data-i18n="btn_save_att">တက်ရောက်မှု သိမ်းမည်</button>
    </div>
  </section>

  <!-- Monthly Report Tab -->
  <section id="monthly" class="tab hidden">
    <div class="card">
      <h2 data-i18n="monthly_title">📊 လစဉ်အစီရင်ခံစာ</h2>
      <div class="row">
        <div class="field"><label data-i18n="lbl_class">အတန်း</label><select id="monthClass"></select></div>
        <div class="field"><label data-i18n="lbl_month">လ</label><input id="monthValue" type="month"></div>
      </div>
      <div id="monthlyList"></div>
    </div>
  </section>

  <!-- Principal Report Tab -->
  <section id="principal" class="tab hidden">
    <div class="card">
      <h2 data-i18n="principal_title">✉️ ကျောင်းအုပ်အစီရင်ခံစာ</h2>
      <div class="row">
        <div class="field"><label data-i18n="lbl_class">အတန်း</label><select id="principalClass"></select></div>
        <div class="field"><label data-i18n="lbl_date">ရက်စွဲ</label><input id="principalDate" type="date"></div>
      </div>
      <div class="field"><label data-i18n="lbl_principal_phone">ကျောင်းအုပ်ဖုန်းနံပါတ်</label><input id="principalPhone" placeholder="09xxxxxxxxx"></div>
      
      <div class="actions" style="margin-top:10px">
        <button class="btn btn-primary" id="generatePrincipal" data-i18n="btn_generate">စာထုတ်မည်</button>
        <button class="btn" id="sendPrincipalSms" style="background:#10b981;color:#fff" data-i18n="btn_send_principal_sms">📱 ကျောင်းအုပ်ထံ SMS ပို့ရန်</button>
      </div>
      <textarea id="principalOutput" readonly placeholder="..."></textarea>

      <h3 style="font-size:14px;color:var(--primary);margin:14px 0 8px" data-i18n="absent_list_title">ပျက်ကွက်သူများ (မိဘထံ SMS ပို့ရန်)</h3>
      <div id="principalAbsentList"></div>
    </div>
  </section>

</main>
<div id="message" class="message hidden"></div>

<script>
'use strict';
const $=id=>document.getElementById(id),
CLASSES=['KG',...Array.from({length:12},(_,i)=>'Grade '+(i+1))],
STATUSES=['တက်','ပျက်','ခွင့်','ခွင့်မဲ့','နောက်ကျ'],
KEY='CFBS_CLASS_TEACHER_ATTENDANCE_V1';

let db={students:[],attendance:{},principalPhone:''};
let currentLang='my'; // Default Myanmar

const translations = {
  my: {
    school_sub: "နေ့စဉ်တက်ရောက်မှုအစီရင်ခံစာ",
    tab_students: "စာရင်း",
    tab_attendance: "တက်ရောက်",
    tab_monthly: "လစဉ်",
    tab_principal: "ကျောင်းအုပ်",
    stat_total: "စုစုပေါင်း",
    stat_boys: "ကျား",
    stat_girls: "မ",
    lbl_class: "အတန်း",
    lbl_search: "ရှာရန်",
    btn_add_student: "＋ ကျောင်းသားအသစ်",
    btn_backup: "Backup သိမ်း",
    btn_restore: "Backup ထည့်",
    form_title: "ကျောင်းသားအချက်အလက်",
    lbl_sid: "ကျောင်းဝင်အမှတ် *",
    lbl_name: "ကျောင်းသားအမည် *",
    lbl_dob: "မွေးသက္ကရာဇ် *",
    lbl_parent: "မိဘအမည် *",
    lbl_gender: "ကျား / မ *",
    opt_boy: "ကျား",
    opt_girl: "မ",
    lbl_phone: "ဖုန်းနံပါတ်",
    lbl_address: "လိပ်စာ",
    lbl_status: "အခြေအနေ",
    opt_active: "လက်ရှိတက်ရောက်",
    opt_inactive: "ကျောင်းမှထွက်",
    btn_save: "သိမ်းမည်",
    btn_cancel: "မလုပ်တော့ပါ",
    lbl_date: "ရက်စွဲ",
    stat_present: "တက်",
    stat_absent: "ပျက်",
    btn_all_present: "အားလုံးတက်",
    btn_all_absent: "အားလုံးပျက်",
    btn_save_att: "တက်ရောက်မှု သိမ်းမည်",
    monthly_title: "📊 လစဉ်အစီရင်ခံစာ",
    lbl_month: "လ",
    principal_title: "✉️ ကျောင်းအုပ်အစီရင်ခံစာ",
    lbl_principal_phone: "ကျောင်းအုပ်ဖုန်းနံပါတ်",
    btn_generate: "စာထုတ်မည်",
    btn_send_principal_sms: "📱 ကျောင်းအုပ်ထံ SMS ပို့ရန်",
    absent_list_title: "ပျက်ကွက်သူများ (မိဘထံ SMS ပို့ရန်)",
    msg_saved: "သိမ်းပြီးပါပြီ",
    msg_att_saved: "တက်ရောက်မှု သိမ်းပြီးပါပြီ",
    msg_backup_loaded: "Backup ထည့်ပြီးပါပြီ",
    msg_err_sid: "ဤကျောင်းဝင်အမှတ် ရှိပြီးသားဖြစ်သည်",
    msg_err_file: "Backup ဖိုင် မှားယွင်းနေပါသည်"
  },
  en: {
    school_sub: "Daily Attendance Dashboard",
    tab_students: "Students",
    tab_attendance: "Attendance",
    tab_monthly: "Monthly",
    tab_principal: "Principal",
    stat_total: "Total",
    stat_boys: "Boys",
    stat_girls: "Girls",
    lbl_class: "Class",
    lbl_search: "Search",
    btn_add_student: "＋ Add Student",
    btn_backup: "Backup",
    btn_restore: "Restore",
    form_title: "Student Details",
    lbl_sid: "Student ID *",
    lbl_name: "Student Name *",
    lbl_dob: "Date of Birth *",
    lbl_parent: "Parent Name *",
    lbl_gender: "Gender *",
    opt_boy: "Boy",
    opt_girl: "Girl",
    lbl_phone: "Phone",
    lbl_address: "Address",
    lbl_status: "Status",
    opt_active: "Active",
    opt_inactive: "Inactive",
    btn_save: "Save",
    btn_cancel: "Cancel",
    lbl_date: "Date",
    stat_present: "Present",
    stat_absent: "Absent",
    btn_all_present: "All Present",
    btn_all_absent: "All Absent",
    btn_save_att: "Save Attendance",
    monthly_title: "📊 Monthly Report",
    lbl_month: "Month",
    principal_title: "✉️ Principal Report",
    lbl_principal_phone: "Principal Phone",
    btn_generate: "Generate",
    btn_send_principal_sms: "📱 Send SMS to Principal",
    absent_list_title: "Absent Students (Send SMS to Parent)",
    msg_saved: "Saved successfully",
    msg_att_saved: "Attendance saved",
    msg_backup_loaded: "Backup restored",
    msg_err_sid: "Student ID already exists",
    msg_err_file: "Invalid backup file"
  }
};

function t(key){
  return translations[currentLang][key] || key;
}

function updateTexts(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    let k=el.getAttribute('data-i18n');
    if(translations[currentLang][k]) el.textContent = translations[currentLang][k];
  });
  $('langToggle').textContent = currentLang === 'my' ? '🇬🇧 English' : '🇲🇲 မြန်မာ';
}

$('langToggle').onclick = () => {
  currentLang = currentLang === 'my' ? 'en' : 'my';
  updateTexts();
  renderStudents();
  renderAtt();
  renderMonth();
  generatePrincipalReport();
};

function makeId(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monthNow(){return today().slice(0,7)}
function msg(text){$('message').textContent=text;$('message').classList.remove('hidden');setTimeout(()=>$('message').classList.add('hidden'),2600)}

function save(){
  try{
    db.principalPhone=$('principalPhone')?.value.trim()||db.principalPhone||'';
    localStorage.setItem(KEY,JSON.stringify(db));
    return true;
  }catch(e){alert('Storage error');return false;}
}

function load(){
  try{
    let x=localStorage.getItem(KEY);
    if(x){x=JSON.parse(x);if(Array.isArray(x.students)&&x.attendance)db=x;}
  }catch(e){}
}

function fill(){
  ['studentClass','attClass','monthClass','principalClass'].forEach(id=>$(id).innerHTML=CLASSES.map(c=>'<option>'+c+'</option>').join(''));
}

function people(cls,active=false){
  let list=db.students.filter(s=>s.className===cls&&(!active||s.active));
  return list.sort((a,b)=>a.sid.localeCompare(b.sid,undefined,{numeric:true}));
}

function key(c,d){return c+'|'+d}
function record(c,d){return db.attendance[key(c,d)]||{}}
function counts(r){
  let x={'တက်':0,'ပျက်':0,'ခွင့်':0,'ခွင့်မဲ့':0,'နောက်ကျ':0};
  Object.values(r||{}).forEach(s=>{if(s in x)x[s]++});
  return x;
}

function tab(n){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('hidden',x.id!==n));
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===n));
  if(n==='students')renderStudents();
  if(n==='attendance')renderAtt();
  if(n==='monthly')renderMonth();
  if(n==='principal')generatePrincipalReport();
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));

function renderStudents(){
  let cls=$('studentClass').value,q=$('studentSearch').value.trim().toLowerCase(),all=people(cls),active=all.filter(s=>s.active),list=all.filter(s=>s.name.toLowerCase().includes(q)||s.sid.toLowerCase().includes(q));
  $('totalStudents').textContent=active.length;
  $('totalBoys').textContent=active.filter(s=>s.gender==='ကျား').length;
  $('totalGirls').textContent=active.filter(s=>s.gender==='မ').length;
  
  let activeText = currentLang==='my'?'လက်ရှိတက်ရောက်':'Active';
  let inactiveText = currentLang==='my'?'ကျောင်းမှထွက်':'Inactive';

  $('studentCardsList').innerHTML=list.map(s=>`
    <div class="item-card">
      <div class="item-info">
        <div class="item-name">${esc(s.name)} (${esc(s.sid)})</div>
        <div class="item-sub">${currentLang==='my'?'မိဘ':'Parent'}: ${esc(s.parent)} | ${currentLang==='my'?'ဖုန်း':'Phone'}: ${esc(s.phone||'-')}</div>
        <span class="item-status ${s.active?'status-active':'status-inactive'}">${s.active?activeText:inactiveText}</span>
      </div>
      <div>
        <button class="btn" style="padding:6px 10px;font-size:12px" data-edit="${esc(s.id)}">✏️</button>
      </div>
    </div>
  `).join('')||`<div class="notice">${currentLang==='my'?'ကျောင်းသားစာရင်း မရှိသေးပါ။':'No students found.'}</div>`;
}

$('studentClass').onchange=renderStudents;
$('studentSearch').oninput=renderStudents;
$('showStudentForm').onclick=()=>{$('studentForm').reset();$('editStudentId').value='';$('sactive').value='yes';$('studentFormBox').classList.remove('hidden')};
$('cancelStudentForm').onclick=()=>$('studentFormBox').classList.add('hidden');

$('studentForm').onsubmit=e=>{
  e.preventDefault();
  let id=$('editStudentId').value,sid=$('sid').value.trim(),name=$('sname').value.trim();
  if(db.students.some(s=>s.sid.toLowerCase()===sid.toLowerCase()&&s.id!==id)){alert(t('msg_err_sid'));return;}
  let old=db.students.find(s=>s.id===id),
  s={
    id:id||makeId(),sid,name,
    dob:$('sdob').value,parent:$('sparent').value.trim(),
    gender:$('sgender').value,phone:$('sphone').value.trim(),
    address:$('saddress').value.trim(),className:old?old.className:$('studentClass').value,
    active:$('sactive').value==='yes',createdAt:old?old.createdAt:new Date().toISOString()
  };
  if(old)Object.assign(old,s);else db.students.push(s);
  if(save()){$('studentFormBox').classList.add('hidden');renderStudents();msg(t('msg_saved'));}
};

$('studentCardsList').onclick=e=>{
  let ed=e.target.closest('[data-edit]');
  if(ed){
    let s=db.students.find(x=>x.id===ed.dataset.edit);
    $('studentClass').value=s.className;
    $('editStudentId').value=s.id;
    ['sid','sname','sdob','sparent','sgender','sphone','saddress'].forEach((id,i)=>$(id).value=[s.sid,s.name,s.dob,s.parent,s.gender,s.phone||'',s.address||''][i]);
    $('sactive').value=s.active?'yes':'no';
    $('studentFormBox').classList.remove('hidden');scrollTo(0,0);
  }
};

function renderAtt(){
  let cls=$('attClass').value,date=$('attDate').value,ss=people(cls,true),r=record(cls,date),c=counts(r);
  $('attPresent').textContent=c['တက်'];
  $('attAbsent').textContent=c['ပျက်'];
  
  $('attendanceCardsList').innerHTML=ss.map(s=>{
    let st=r[s.id]||'';
    return `
      <div class="item-card">
        <div class="item-info">
          <div class="item-name">${esc(s.name)}</div>
          <div class="item-sub">ID: ${esc(s.sid)}</div>
        </div>
        <div>
          <select data-status="${esc(s.id)}" style="padding:6px;font-size:12px;width:auto">
            <option value="">--</option>
            ${STATUSES.map(o=>`<option value="${o}" ${st===o?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>
      </div>
    `;
  }).join('')||`<div class="notice">${currentLang==='my'?'ကျောင်းသား မရှိပါ။':'No students.'}</div>`;
}

$('attClass').onchange=renderAtt;
$('attDate').onchange=renderAtt;

$('attendanceCardsList').onchange=e=>{
  let sel=e.target.closest('[data-status]');
  if(!sel)return;
  let cls=$('attClass').value,date=$('attDate').value;
  if(!date){alert(currentLang==='my'?'ရက်စွဲရွေးပါ။':'Select date.');return;}
  let r={...record(cls,date)};
  if(sel.value)r[sel.dataset.status]=sel.value;else delete r[sel.dataset.status];
  db.attendance[key(cls,date)]=r;
  save();renderAtt();
};

$('saveAttendance').onclick=()=>{save();msg(t('msg_att_saved'));};

function renderMonth(){
  let cls=$('monthClass').value,m=$('monthValue').value,ss=people(cls,true),per={};
  ss.forEach(s=>per[s.id]=counts({}));
  Object.entries(db.attendance).forEach(([k,r])=>{
    if(!k.startsWith(cls+'|'))return;
    let d=k.slice(cls.length+1);
    if(!d.startsWith(m+'-'))return;
    ss.forEach(s=>{let st=r[s.id];if(STATUSES.includes(st))per[s.id][st]++;});
  });

  $('monthlyList').innerHTML=ss.map(s=>`
    <div class="item-card">
      <div class="item-info">
        <div class="item-name">${esc(s.name)}</div>
        <div class="item-sub">${currentLang==='my'?'တက်':'Present'}: <b>${per[s.id]['တက်']}</b> | ${currentLang==='my'?'ပျက်':'Absent'}: <b style="color:red">${per[s.id]['ပျက်']}</b></div>
      </div>
    </div>
  `).join('')||`<div class="notice">${currentLang==='my'?'ဒေတာ မရှိပါ။':'No data.'}</div>`;
}
$('monthClass').onchange=renderMonth;
$('monthValue').onchange=renderMonth;

function generatePrincipalReport(){
  let cls=$('principalClass').value,date=$('principalDate').value,ss=people(cls,true),r=record(cls,date);
  if(!date)return;
  let d=date.split('-');
  let absentList=ss.filter(s=>['ပျက်','ခွင့်မဲ့','ခွင့်'].includes(r[s.id]));
  
  let lines=[
    'CHINDWIN FUTURE BRIGHT SCHOOL',
    'နေ့စဉ်တက်ရောက်မှုအစီရင်ခံစာ',
    'ရက်စွဲ='+d[2]+'/'+d[1]+'/'+d[0],
    'အတန်း='+cls,
    'စာရင်းရှိ='+ss.length,
    'ပျက်ကွက်ကျောင်းသား='+(absentList.length?absentList.map(s=>s.name).join(', '):'မရှိပါ')
  ];

  $('principalOutput').value=lines.join('\n');
  
  $('principalAbsentList').innerHTML=absentList.map(s=>{
    let phone=s.phone||'';
    let msgText=`CHINDWIN FUTURE BRIGHT: ${cls}မှ ကျောင်းသား/သူ ${s.name} သည် ယနေ့ (${d[2]}/${d[1]}/${d[0]}) တွင် ကျောင်းပျက်ကွက်ပါကြောင်း အသိပေးအပ်ပါသည်။`;
    let smsLink=phone?`sms:${phone}?body=${encodeURIComponent(msgText)}`:'#';
    return `
      <div class="item-card">
        <div class="item-info">
          <div class="item-name">${esc(s.name)} (${esc(r[s.id]||'ပျက်')})</div>
          <div class="item-sub">${currentLang==='my'?'မိဘဖုန်း':'Phone'}: ${esc(phone||'-')}</div>
        </div>
        <div>
          ${phone?`<a href="${smsLink}" style="display:inline-block;padding:6px 10px;background:#10b981;color:#fff;border-radius:8px;text-decoration:none;font-size:12px;font-weight:bold">📱 SMS</a>`:''}
        </div>
      </div>
    `;
  }).join('')||`<div class="notice">${currentLang==='my'?'ယနေ့ ပျက်ကွက်သူ မရှိပါ။':'No absent students.'}</div>`;
}

$('generatePrincipal').onclick=generatePrincipalReport;
$('principalClass').onchange=generatePrincipalReport;
$('principalDate').onchange=generatePrincipalReport;

$('sendPrincipalSms').onclick=()=>{
  let phone=$('principalPhone').value.trim();
  let text=$('principalOutput').value;
  if(!text){alert(currentLang==='my'?'အစီရင်ခံစာ ပြုလုပ်ပါ':'Generate report');return;}
  if(!phone){
    phone=prompt(currentLang==='my'?'ကျောင်းအုပ်ကြီး၏ ဖုန်းနံပါတ် ဖြည့်ပါ:':'Enter principal phone:');
    if(phone){$('principalPhone').value=phone;save();}else return;
  }
  window.location.href=`sms:${phone}?body=${encodeURIComponent(text)}`;
};

$('backupButton').onclick=()=>{
  let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),
  url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='CFBS-Backup-'+today()+'.json';a.click();
};

$('chooseRestore').onclick=()=>$('restoreFile').click();
$('restoreFile').onchange=()=>{
  let f=$('restoreFile').files[0];
  if(!f)return;
  let rd=new FileReader();
  rd.onload=()=>{
    try{
      let x=JSON.parse(rd.result);
      if(Array.isArray(x.students)){db=x;save();init();msg(t('msg_backup_loaded'));}
    }catch(e){alert(t('msg_err_file'));}
  };
  rd.readAsText(f);
};

function init(){
  load();fill();
  $('attDate').value=today();
  $('principalDate').value=today();
  $('monthValue').value=monthNow();
  if(db.principalPhone)$('principalPhone').value=db.principalPhone;
  updateTexts();
  renderStudents();renderAtt();renderMonth();generatePrincipalReport();
}
init();
</script>
</body>
</html>
